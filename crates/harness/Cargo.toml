[package]
name = "agent-vm-harness"
description = "Test-harness tooling for agent-vm: the fixture, driver and oracle subcommands the shell suites call"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Test tooling only. Not shipped, not published, and deliberately not a
# dependency of `agent-vm`: it is an independent oracle (ADR-0072).
publish = false

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# Process, PTY, terminal-mode and event primitives (setsid, process groups,
# wait, getpgid/getsid; posix_openpt; tcgetattr/tcsetattr; poll). `rustix`
# exposes no signal *handler* registration, so the `sigaction` calls in
# `released_image_launch` and `pty` come from `libc`, the same escape hatch
# `agent-vm` uses for `waitid` and `kill`. Both are already in the graph.
rustix = { version = "1.1", features = ["process", "pty", "termios", "event", "pipe"] }
libc = "0.2"
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
sha2 = "0.10"
tar = "0.4"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
