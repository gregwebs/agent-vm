[package]
name = "agent-vm"
description = "Sandboxed microVMs for AI coding agents, built on microsandbox."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "agent-vm"
path = "src/main.rs"

[dependencies]
# default-features = false drops the SDK's `prebuilt` feature, so building
# agent-vm never downloads the upstream msb+libkrunfw bundle — we ship our own
# from-source msb. Keep net + keyring (the SDK's other defaults).
microsandbox = { path = "../../vendor/microsandbox/sdk/rust", default-features = false, features = ["net", "keyring"] }
# Direct dep (not re-exported by the SDK crate above) so run.rs/layer.rs can
# read cached OCI image metadata (GlobalCache::read_image_metadata) and
# import Reference/ImageConfig/CachedImageMetadata directly.
microsandbox-image = { path = "../../vendor/microsandbox/crates/image" }
# Direct dep so agent-vm can read the vendored migration set and derive the
# bundled schema-version identifier (see src/msb_schema.rs). Already in the
# build graph transitively via the microsandbox SDK crate; this just makes
# Migrator nameable here. No new compilation.
microsandbox-migration = { path = "../../vendor/microsandbox/crates/migration" }
# Direct dep because the v0.6.15 baseline SDK no longer re-exports this crate
# (the 0.5.7 gw fork's sdk/rust/lib/lib.rs did). network.rs uses policy types,
# while credential_injection.rs and intercept_hook.rs actively configure and
# test NetworkBuilder, file-backed secrets, and request interception.
# See agent-vm issues #40 and #51.
microsandbox-network = { path = "../../vendor/microsandbox/crates/network" }
# Direct dep so src/msb_install.rs can reuse the runtime's OWN
# `ipc::sandbox_socket_paths` derivation (SHA-256-hashed per-sandbox socket
# dir, not the raw sandbox name) for the macOS Unix-socket-path-limit
# preflight (AC#6, agent-vm issue #40) — reusing it, instead of
# re-implementing the hash/path template by hand, keeps the check from
# silently drifting out of sync with the actual boot path. Already in the
# build graph transitively via the "net"-enabled SDK; default-features=false
# only opts this crate itself out of "prebuilt"/"net", which nothing here
# needs. No new compilation.
microsandbox-runtime = { path = "../../vendor/microsandbox/crates/runtime", default-features = false }
# Direct dep only so src/msb_preflight.rs can name Database/Statement/query_all
# to read applied seaql_migrations without going through the SDK's crashing
# open path (Migrator::up). Already in the build graph transitively (SDK +
# microsandbox-migration both depend on it); requested features are a subset
# of what the vendored workspace already enables (vendor/microsandbox/Cargo.toml),
# so this adds no new sea-orm compilation. See issue #30.
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "time"] }
# `wrap_help` makes clap detect the terminal width and wrap long help
# text to it; without it the multi-paragraph `--help` prose renders as
# unbroken one-line-per-paragraph walls.
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
anyhow = "1.0"
base64 = "0.22"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
console = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
libc = "0.2"
ipnetwork = "0.21"
rustix = { version = "1.1", features = ["fs"] }
getrandom = "0.4"
# The tooling-layer build (layer.rs) needs a private, RAII-cleaned temp path
# for the OCI archive `docker buildx build --output type=oci` writes before
# `load_archive` ingests it — a runtime need, not just a test fixture, so
# this is promoted out of dev-dependencies (see the crate's other runtime
# deps for the pattern; `tempfile::Builder::tempfile_in` is used to keep the
# file under the msb cache dir rather than the system tmp, per AGENTS.md).
tempfile = "3"

[dev-dependencies]
# Used only by the msb_preflight / preflight_boot / msb_passthrough tests to
# CONSTRUCT a valid SQLite fixture DB with a seaql_migrations table (a plain
# `std::fs::write` of arbitrary bytes, as doctor_reset.rs's fixture does, is
# not a valid SQLite file and so is insufficient here). Already in the build
# graph via sea-orm's sqlx-sqlite feature. See issue #30.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
# Used only by tests/msb_migration_0_5_7.rs to drive
# `microsandbox_migration::Migrator::up` directly (issue #42). That call
# needs a `sea_orm::DatabaseConnection` of the SAME sea-orm major version
# `microsandbox-migration` itself compiles against (2.0, via its
# `sea-orm-migration.workspace = true` dependency inside
# vendor/microsandbox) -- NOT the 1.1 `sea-orm` this crate already depends
# on directly for msb_preflight.rs's plain `SELECT` (see that dependency's
# own comment, issue #30). Two different major versions of the same crate
# name are distinct Rust types even when both are present in one dependency
# graph, so `microsandbox_migration::Migrator::up` cannot accept a
# connection built from the 1.1 dependency. Pinning the same "2.0" range
# here lets Cargo's resolver reuse the exact sea-orm-migration 2.0.2 (and
# its re-exported sea_orm 2.0.2) already pulled in transitively by
# microsandbox-migration, rather than adding a second, incompatible 2.x
# resolution. Test-only: no runtime/production code needs this.
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
