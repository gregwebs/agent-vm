[package]
name = "agent-vm"
description = "Sandboxed microVMs for AI coding agents, built on microsandbox."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agent-vm"
path = "src/main.rs"

[dependencies]
# default-features = false drops the SDK's `prebuilt` feature, so building
# agent-vm never downloads the upstream msb+libkrunfw bundle — we ship our own
# from-source msb. Keep net + keyring (the SDK's other defaults).
microsandbox = { path = "../../vendor/microsandbox/sdk/rust", default-features = false, features = ["net", "keyring"] }
# Direct dep (not re-exported by the SDK crate above) so run.rs/layer.rs can
# read cached OCI image metadata (GlobalCache::read_image_metadata) and
# import Reference/ImageConfig/CachedImageMetadata directly.
microsandbox-image = { path = "../../vendor/microsandbox/crates/image" }
# Direct dep so agent-vm can read the vendored migration set and derive the
# bundled schema-version identifier (see src/msb_schema.rs). Already in the
# build graph transitively via the microsandbox SDK crate; this just makes
# Migrator nameable here. No new compilation.
microsandbox-migration = { path = "../../vendor/microsandbox/crates/migration" }
# Direct SQLite adapter for the bounded, read-only migration inspection.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "time"] }
# `wrap_help` makes clap detect the terminal width and wrap long help
# text to it; without it the multi-paragraph `--help` prose renders as
# unbroken one-line-per-paragraph walls.
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
anyhow = "1.0"
base64 = "0.22"
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
console = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
libc = "0.2"
ipnetwork = "0.21"
# The tooling-layer build (layer.rs) needs a private, RAII-cleaned temp path
# for the OCI archive `docker buildx build --output type=oci` writes before
# `load_archive` ingests it — a runtime need, not just a test fixture, so
# this is promoted out of dev-dependencies (see the crate's other runtime
# deps for the pattern; `tempfile::Builder::tempfile_in` is used to keep the
# file under the msb cache dir rather than the system tmp, per AGENTS.md).
tempfile = "3"

# Integration tests that drive the actual secret-substitution layer
# end-to-end with the hook's anonymisation logic. Kept out of release
# deps so production builds don't pull in the entire network stack.
[dev-dependencies]
microsandbox-network = { path = "../../vendor/microsandbox/crates/network" }
