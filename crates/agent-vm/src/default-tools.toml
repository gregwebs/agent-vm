# The seven tools agent-vm ships a definition for, used only when BOTH the
# user and project config files declare zero tools (see src/config.rs).
#
# This is the single shipped source of the launch-verb catalog: it is embedded
# at compile time with `include_str!` and parsed through exactly the same
# raw-to-validated path as a user's file. `agent-vm doctor` never writes it
# out; there is no starter-config writer (#80's non-goals). The built-in
# `shell` fallback (when a config omits the name) is this file's `shell` entry,
# re-parsed — there is no second definition.
#
# Order matters only for presentation: the declaration order below is the order
# `agent-vm --help` and `agent-vm doctor` show the verbs. The image is selected
# independently of the catalog (see src/boot_image.rs), so this order no longer
# drives any image composition.
#
# `args` holds the flags prepended before the user's own args (`run::inner_argv`
# drops any the user already passed). The microVM is the security boundary, so
# the in-VM agent's "are you sure?" prompts add no protection and break
# agent-mode flows — that is why claude gets `--dangerously-skip-permissions`
# and copilot `--allow-all-tools`.
#
# `codex` and `opencode` carry NO default argv on purpose. Their non-interactive
# "bypass" configuration is persisted as files by provider code
# (credential_provider::write_openai_bypass / write_opencode_bypass,
# src/credential_provider.rs), not by a missing `--yolo`-style flag. Do not
# "fix" the empty `args` below by inventing one.
#
# The rule that makes a tool's `env` safe — publication order, precedence, and
# the HOME/USER/LOGNAME rejection — is documented in ADR-0016. This file only
# declares the pairs; the rationale for the one pair below:
#
# `codex` needs CODEX_HOME because codex is the one agent with no ~/<dotfile>
# symlink into the state dir — its install prefix holds `packages/` and a
# symlink at ~/.codex would shadow the binary itself (ARCHITECTURE.md,
# credential_provider::guest_home_links). `shell` carries the same pair
# because its omitted `tools` defaults to the wildcard, and in the shipped
# default catalog that wildcard closes over this file's six agents (see
# ADR-0017), so codex/auth.json is provisioned on a shell launch and dropping
# the pointer would leave a fully-provisioned, unreachable credential. The
# other five agents never read CODEX_HOME.
#
# `shell` declares no `credentials`: it is not an agent and must not inherit
# any provider's hard bail (Anthropic's and Copilot's would make `agent-vm
# shell` fail for any user without both host logins). Its omitted `tools`
# defaults to `["*"]`, so it *provisions* every provider the other tools *in its
# own reference scope* declare without *requiring* any of them. See ADR-0017.
#
# This entry is also the fallback for a config that declares no `shell`, and it
# is re-parsed into a scope holding only itself (#395): a custom catalog's
# fallback therefore provisions nothing, while this shipped seven-tool scope
# keeps `shell`'s wildcard covering the other six.

# Network requests are TLS/TCP 443 diagnostic metadata, not grants or
# credential effects. Scoped provider/refresh/relay/catalog baseline, not all
# optional traffic. Evidence: docs/default-tool-network-requests.md.
# Shell has no provider destination and inherits no requests from provisioning.

# `dsh` (DeepSeek Harness) boots its browser UI with no profile flag, so the
# shipped default argv is `web` (the same command issue #149 installs with).
# The guest reaches that UI through the launcher's `--publish` inbound port.
#
# Like `pi`, dsh declares no `credentials`: it is a multi-provider harness
# whose adapter list is configuration, and it must start with none configured.
# No universal network request: its dormant adapter has no configured provider.
# Browser UI ingress is not egress.
# Its base profile already mounts the `llm-pi-ai` multi-provider adapter dormant
# (`@deepseek-ai/dsh-base`'s `cordis.patch.yml`), so a user who wants
# Anthropic/OpenAI support stores an API key in the credentials document or
# environment rather than inheriting a provider's hard bail. It therefore gets
# no credential provider and cannot fail a launch for a missing host login.
# Community OAuth/subscription plugins are deliberately not baked in: they are
# unreviewed third-party code that holds the user's credentials.
#
# Its `persist` owns dsh's whole `$DSH_HOME` (`~/.dsh` by default): profiles,
# sessions, and the `~/.dsh/.credentials.yaml` document a user's API keys live
# in. Persisting the directory tree (rather than a single file) is what makes
# a key stored once in the Models UI survive the next launch — the same
# per-project-state guarantee `pi` gets from its generic `.pi` link.
[[tools]]
name = "dsh"
command = "dsh"
args = ["web"]
persist = [".dsh"]

# `pi` still declares no `credentials`: Pi supports many providers, enrolls
# more during a session, and must start with none configured, so it must not
# inherit any provider's hard bail.
#
# It DOES declare `tools = ["claude", "codex"]`. Each named tool exists to
# supply a credential that an image-owned Pi extension needs and Pi's own
# `auth.json` cannot provide. Naming a tool provisions its provider WITHOUT
# requiring it (ADR-0017: named tools are provisioned, never required), so
# `agent-vm pi` writes the guest placeholders, registers the proxy
# substitutions, and still launches for a user with no host login of either
# kind. This is ADR-0017 alternative 2 ("a tool that connects to another tool").
#
# `claude` -> the pi-claude-bridge extension spawns Claude Code as a child, so
# it needs *Claude Code's* credential. Inherited side effect: the Anthropic
# bypass configs (`claude/settings.json`, `claude.json`) are written on a `pi`
# launch too, because `write_bypass_configs` follows the provisioning set, not
# capture.
#
# `codex` -> the agent-vm-codex extension registers a Pi provider that carries
# the `codex/auth.json` placeholder to `chatgpt.com` (ADR-0044). Inherited side
# effects of the `openai` provider: `codex/config.toml` is written, and a
# successful capture overwrites a guest-authored `codex/auth.json`. That
# extension reads a fixed path -- it does NOT inherit `codex`'s `CODEX_HOME`,
# because tool `env` belongs to the launched tool (ADR-0016), so this file must
# never grow one here.
#
# Pi's own credential file (~/.pi/agent/auth.json) is never imported: #94
# (Anthropic) was closed as superseded by #164, and #91's host-Pi route is
# superseded for OpenAI/Codex by #360's tool edge above.
#
# The guest-state mapping and PI_SKIP_VERSION_CHECK are issue #96. It
# deliberately declares no `--approve` (or any trust/telemetry) default:
# agent-vm forces no trust or telemetry policy, so Pi's own project-trust flag
# and telemetry are forwarded -- see ADR-0021.
[[tools]]
name = "pi"
# Explicit shipped baseline: the bridge's three names plus the two the
# image-owned agent-vm-codex extension dials. Not inherited from `tools`, and
# deliberately without api.openai.com: only Pi's built-in `openai` provider
# reaches it, and only with a user-configured key (ADR-0039).
network_requests = ["api.anthropic.com", "auth.openai.com", "chatgpt.com", "mcp-proxy.anthropic.com", "platform.claude.com"]
command = "pi"
args = []
tools = ["claude", "codex"]
persist = []

[[tools]]
name = "codex"
network_requests = ["api.openai.com", "auth.openai.com", "chatgpt.com"]
command = "codex"
args = []
credentials = ["openai"]
persist = []
env = { CODEX_HOME = "/agent-vm-state/codex" }

[[tools]]
name = "opencode"
network_requests = ["api.openai.com", "auth.openai.com", "chatgpt.com", "models.opencode.ai"]
command = "opencode"
args = []
credentials = ["openai", "opencode-static"]
persist = []

[[tools]]
name = "claude"
network_requests = ["api.anthropic.com", "mcp-proxy.anthropic.com", "platform.claude.com"]
command = "claude"
args = ["--dangerously-skip-permissions"]
credentials = ["anthropic"]
persist = []

[[tools]]
name = "copilot"
# Known incomplete inventory, not providerless: deferred to #340 (see evidence doc).
command = "copilot"
args = ["--allow-all-tools"]
credentials = ["copilot"]
persist = []

# `shell` is bash, not an agent, and declares no `credentials`.
#
# `-O histappend` makes the interactive bash *append* its in-memory history to
# the shared bind-mounted `~/.bash_history` on exit instead of overwriting it.
# Without it, two concurrent `agent-vm shell` invocations in the same project
# would have the later-exiting shell wholesale clobber the earlier shell's
# commands (the symlink target is the same host file; see
# credential_provider::guest_home_links and ADR-0002).
#
# `interactive_shell = true` makes `run::inner_argv` join the user's trailing
# args into a single `bash -c` command line instead of appending them as
# separate argv entries, so `agent-vm shell ls -l` runs `ls -l` rather than
# PATH-searching for a script named `ls`.
[[tools]]
name = "shell"
command = "bash"
args = ["-O", "histappend"]
persist = []
interactive_shell = true
env = { CODEX_HOME = "/agent-vm-state/codex" }
