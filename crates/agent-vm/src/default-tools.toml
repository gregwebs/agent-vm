# The six tools agent-vm ships a definition for, used only when BOTH the
# user and project config files declare zero tools (see src/config.rs).
#
# This is the single shipped source of the launch-verb catalog: it is embedded
# at compile time with `include_str!` and parsed through exactly the same
# raw-to-validated path as a user's file. `agent-vm doctor` never writes it
# out; there is no starter-config writer (#80's non-goals). The built-in
# `shell` fallback (when a config omits the name) is this file's `shell` entry,
# re-parsed — there is no second definition.
#
# Order matters. The declaration order below is the order `agent-vm --help`
# and `agent-vm doctor` show the verbs, and the order the tool layers are
# composed in (#84). The image build keeps the same cache-motivated ordering
# (pi first, then codex, then opencode, then claude) — see images/tools/README.md.
#
# `args` holds the flags prepended before the user's own args (`run::inner_argv`
# drops any the user already passed). The microVM is the security boundary, so
# the in-VM agent's "are you sure?" prompts add no protection and break
# agent-mode flows — that is why claude gets `--dangerously-skip-permissions`
# and copilot `--allow-all-tools`.
#
# `codex` and `opencode` carry NO default argv on purpose. Their non-interactive
# "bypass" configuration is persisted as files by provider code
# (credential_provider::write_openai_bypass / write_opencode_bypass,
# src/credential_provider.rs), not by a missing `--yolo`-style flag. Do not
# "fix" the empty `args` below by inventing one.
#
# The rule that makes a tool's `env` safe — publication order, precedence, and
# the HOME/USER/LOGNAME rejection — is documented in ADR-0016. This file only
# declares the pairs; the rationale for the one pair below:
#
# `codex` needs CODEX_HOME because codex is the one agent with no ~/<dotfile>
# symlink into the state dir — its install prefix holds `packages/` and a
# symlink at ~/.codex would shadow the binary itself (ARCHITECTURE.md,
# credential_provider::guest_home_links). `shell` carries the same pair
# because its omitted `tools` defaults to the wildcard, and in the shipped
# default catalog that wildcard closes over this file's five agents (see
# ADR-0017), so codex/auth.json is provisioned on a shell launch and dropping
# the pointer would leave a fully-provisioned, unreachable credential. The
# other four agents never read CODEX_HOME.
#
# `shell` declares no `credentials`: it is not an agent and must not inherit
# any provider's hard bail (Anthropic's and Copilot's would make `agent-vm
# shell` fail for any user without both host logins). Its omitted `tools`
# defaults to `["*"]`, so it *provisions* every provider the catalog's tools
# declare without *requiring* any of them. See ADR-0017.

# `pi` declares no `credentials`: Pi supports many providers, enrolls more during
# a session, and must start with none configured, so it must not inherit any
# provider's hard bail. Host-credential import is issue #94/#91; the guest-state
# mapping and PI_SKIP_VERSION_CHECK are issue #96. It deliberately declares no
# `--approve` (or any trust/telemetry) default: agent-vm forces no trust or
# telemetry policy, so Pi's own project-trust flag and telemetry are forwarded
# -- see ADR-0021. Its layer is first in the chain because it is the largest and
# the least frequently changed -- see images/tools/README.md.
[[tools]]
name = "pi"
command = "pi"
args = []
layer = { builtin = "pi" }
persist = []

[[tools]]
name = "codex"
command = "codex"
args = []
layer = { builtin = "codex" }
credentials = ["openai"]
persist = []
env = { CODEX_HOME = "/agent-vm-state/codex" }

[[tools]]
name = "opencode"
command = "opencode"
args = []
layer = { builtin = "opencode" }
credentials = ["openai", "opencode-static"]
persist = []

[[tools]]
name = "claude"
command = "claude"
args = ["--dangerously-skip-permissions"]
layer = { builtin = "claude" }
credentials = ["anthropic"]
persist = []

[[tools]]
name = "copilot"
command = "copilot"
args = ["--allow-all-tools"]
layer = { builtin = "copilot" }
credentials = ["copilot"]
persist = []

# `shell` is bash, not an agent, and has no tooling layer.
#
# `-O histappend` makes the interactive bash *append* its in-memory history to
# the shared bind-mounted `~/.bash_history` on exit instead of overwriting it.
# Without it, two concurrent `agent-vm shell` invocations in the same project
# would have the later-exiting shell wholesale clobber the earlier shell's
# commands (the symlink target is the same host file; see
# credential_provider::guest_home_links and ADR-0002).
#
# `interactive_shell = true` makes `run::inner_argv` join the user's trailing
# args into a single `bash -c` command line instead of appending them as
# separate argv entries, so `agent-vm shell ls -l` runs `ls -l` rather than
# PATH-searching for a script named `ls`.
[[tools]]
name = "shell"
command = "bash"
args = ["-O", "histappend"]
persist = []
interactive_shell = true
env = { CODEX_HOME = "/agent-vm-state/codex" }
