name: verify-release-probe

# Throwaway diagnostic: can GitHub-hosted amd64 runners run the image owner's
# public promotion gate (verify-release.sh --boot) for v0.1.3?
on:
  push:
    branches: [probe/kvm-availability]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-gate-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Unlock KVM for the runner user (documented udev recipe)
        run: |
          set -eux
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Check out the pinned image-owner release interfaces
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: gregwebs/agent-vm-images
          ref: 087f8bad3de624a5dad38f1669e7dea96996371a
          path: images
          persist-credentials: false

      - name: Provision image-owner CI tools
        run: bash images/script/release/install-ci-tools.sh

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install a reviewed msb + firmware pair from npm
        run: |
          set -eux
          mkdir -p /tmp/msb && cd /tmp/msb
          npm init -y >/dev/null
          npm install @wirenboard/agent-vm 2>&1 | tail -5
          plat=node_modules/@wirenboard/agent-vm-linux-x64
          ls -l "$plat/bin" "$plat/lib"
          {
            echo "MSB_BIN=$PWD/$plat/bin/msb"
            echo "MSB_FW=$(ls "$PWD"/$plat/lib/libkrunfw.so.5*)"
          } >> "$GITHUB_ENV"

      - name: Download the published v0.1.3 assets anonymously
        run: |
          set -eux
          mkdir -p /tmp/assets
          bash images/script/release/download-release.sh --version 0.1.3 --arch amd64 --out /tmp/assets
          ls -l /tmp/assets | head -30

      - name: Run the promotion gate with a real amd64 boot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSB_LIBKRUNFW_PATH: ${{ env.MSB_FW }}
        run: |
          set -eux
          bash images/script/release/verify-release.sh \
            --version 0.1.3 \
            --arch amd64 \
            --assets-dir /tmp/assets \
            --msb-bin "$MSB_BIN" \
            --boot

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-release-amd64-logs
          path: /tmp/assets/*.log
          if-no-files-found: ignore
          retention-days: 5
