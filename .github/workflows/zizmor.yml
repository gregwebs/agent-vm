name: zizmor

# Static analysis of our GitHub Actions configuration with zizmor
# (https://github.com/zizmorcore/zizmor). Runs whenever the CI
# configuration itself changes, so a newly introduced workflow (or an
# edit to an existing one) gets audited for injection risks, overly
# broad permissions, unpinned actions, etc. before it lands.

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"

permissions: {}

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
