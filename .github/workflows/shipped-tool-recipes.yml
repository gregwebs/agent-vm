name: shipped-tool-recipes

# The pre-merge contract gate for the six shipped tool recipes (#227): build
# each recipe INDEPENDENTLY from the committed tool-free base, audit the result
# as an arbitrary numeric uid (version report + T5 command access + status
# record) and REPLAY every `org.agent-vm.version.*` label back as an explicit
# build ARG onto a second, distinct tool-free base.
#
# It runs on GitHub's native amd64 runner, never under QEMU, and only ever uses
# committed inputs: the default pins from the Dockerfiles and the committed
# exact alternates in script/test/shipped-tool-recipes.sh. No test value is
# resolved from `latest`. The deeper arm64 evidence and the restricted-egress
# native-installer gate (script/test/shipped-installer-network.sh) are separate
# developer/dispatched steps recorded in the PR.
on:
  push:
    paths:
      - 'images/**'
      - 'script/build/agent-versions.sh'
      - 'script/build/sync-recipe-contracts.sh'
      - 'script/test/shipped-tool-recipes.sh'
      - 'script/test/shipped-installer-network.sh'
      - 'script/test/host-watchdog.sh'
      - 'script/test/host-watchdog.py'
      - 'script/test/fixtures/t5-negative/**'
      - 'script/test/fixtures/installer-egress/**'
      - 'script/test/ci-contracts.sh'
      - '.github/workflows/shipped-tool-recipes.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'script/build/agent-versions.sh'
      - 'script/build/sync-recipe-contracts.sh'
      - 'script/test/shipped-tool-recipes.sh'
      - 'script/test/shipped-installer-network.sh'
      - 'script/test/host-watchdog.sh'
      - 'script/test/host-watchdog.py'
      - 'script/test/fixtures/t5-negative/**'
      - 'script/test/fixtures/installer-egress/**'
      - 'script/test/ci-contracts.sh'
      - '.github/workflows/shipped-tool-recipes.yml'
  workflow_dispatch:
    inputs:
      full_contract:
        description: 'Also build the exact alternates + six-layer chain (slow)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shipped-tool-recipes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    # amd64 only: match the architecture GitHub publishes and audit the recipes
    # they ship on their native runner. arm64 evidence is collected locally on
    # Apple Silicon and reported before merge.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The runner is ephemeral and dedicated to this job, so reclaiming the
      # documented unused preinstalled SDKs (Android/.NET) is safe here and is
      # what keeps the recipe downloads inside the disk budget. Never do this on
      # a shared/local daemon.
      - name: Reclaim unused preinstalled SDKs (ephemeral runner only)
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install shellcheck and guard this workflow's script
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n script/test/shipped-tool-recipes.sh
          shellcheck script/test/shipped-tool-recipes.sh
          bash -n script/test/shipped-installer-network.sh
          shellcheck script/test/shipped-installer-network.sh
          bash -n script/test/host-watchdog.sh
          shellcheck script/test/host-watchdog.sh
          python3 -c 'import ast,sys; ast.parse(open(sys.argv[1],encoding="utf-8").read(),sys.argv[1])' \
            script/test/host-watchdog.py

      # driver: docker so `--load`ed images stay visible to the next
      # `FROM $BASE_IMAGE` from the daemon's local store.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker

      - name: Disk + cache report (before)
        run: |
          set -euo pipefail
          df -h /
          docker system df

      - name: Build the tool-free base
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load \
            -t agent-vm-base:contract -f images/Dockerfile images

      - name: Audit the shipped recipes (default) or the full contract
        env:
          FULL_CONTRACT: ${{ inputs.full_contract }}
        run: |
          set -euo pipefail
          if [ "$FULL_CONTRACT" = "true" ]; then
            script/test/shipped-tool-recipes.sh agent-vm-base:contract --overrides --chain
            # Full-contract mode additionally produces native amd64 evidence for
            # the restricted-egress gate: the REAL patched vendored installers
            # run against a deny-by-default proxy that allows only committed
            # exact-selection URLs. Defaults come from the committed
            # selections.tsv (asserted equal to the Dockerfile ARGs), never
            # `latest`.
            script/test/shipped-installer-network.sh agent-vm-base:contract --overrides
          else
            script/test/shipped-tool-recipes.sh agent-vm-base:contract
          fi

      - name: Disk + cache report (after)
        if: always()
        run: |
          df -h /
          docker system df
