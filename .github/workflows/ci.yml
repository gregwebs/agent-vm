name: CI

# A same-repo branch push fires *both* `push` and `pull_request` while a PR is
# open, so an ungated `push` runs every job twice for one commit. `push` is
# gated to `main` (landed commits) and to the `ci/` scratch prefix
# (pre-PR branches), while `pull_request` covers every branch under review. See
# CONTRIBUTING.md — *CI on a branch*.
on:
  push:
    branches: ["main", "ci/**"]
  pull_request:
  workflow_dispatch:

# Everything except a `main` push is superseded by a newer run: re-pushing to a
# PR or to a `ci/` scratch branch cancels the run for the commit it replaced.
# `main` pushes are left to finish, so each landed commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# The jobs below are independent gates, and they are separate jobs because one
# job pays the *sum* of its steps while parallel jobs pay the longest. Measured
# on a single `build-and-test` job (run 42481235526, 30m18s): contracts 9m25s,
# test 11m01s, release build 5m10s, single-binary contract 1m39s, clippy 0m43s.
# They are split here, so a PR now costs roughly the longest leg instead.
#
# Each job carries its own cargo cache (Swatinem/rust-cache keys on the job id),
# so the first run of a job is cold and later runs are not. Keep the split in
# step with that: adding a step to the wrong job is how one leg becomes the new
# critical path.
jobs:
  # The pre-build gate: runtime source provenance, harness contracts and the
  # shell guard rail. It builds nothing of its own except the compatibility
  # evidence crate, so it runs beside the build legs rather than in front of
  # them — but it still gates: `build-and-test` below fails if it fails.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (2026-08-05)
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep the vendored path crates' artefacts. The action's defaults drop
          # every crate without a registry source (`vendor/microsandbox/*`), so a
          # warm run recompiled ~16 of them anyway; release-npm.yml sets these
          # two for the same reason and documents it there.
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcap-ng-dev libdbus-1-dev shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Check runtime and launcher distribution contracts
        run: bash script/test/ci-contracts.sh

      - name: actionlint
        run: |
          "$HOME/go/bin/actionlint"

  # One job per shard. `cargo test` runs a package's test binaries one at a
  # time, so the suite cost the sum of their wall clocks — 609s, 243s of it in
  # tests/config_launch_driven.rs alone. `script/test/ci-test-shard.sh` deals
  # the test targets to the shards; the shard count is this matrix's length.
  test:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (2026-08-05)
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcap-ng-dev libdbus-1-dev

      # The three shards share one cache key (the action keys on the job id, not
      # the matrix index), so the first shard to finish saves what all three
      # restored. The timeout covers a shard's own worst case, not the suite's.
      - name: Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        env:
          # Through the environment, not interpolated into `run`: a matrix value
          # in a script body is a template expansion zizmor flags.
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          timeout --signal=TERM --kill-after=10s 30m \
            bash script/test/ci-test-shard.sh "$SHARD" "$SHARDS"

      # #626: libtest captures a row's stderr, so a row that returned early --
      # printing `SKIPPED` -- is reported `ok` and the job cannot tell whether it
      # ran. These two rows now fail rather than skip on Linux; this step puts
      # their execution, and the path they resolved, in the job log, and fails if
      # either stops running. One shard pays for the extra link.
      - name: Prove the non-UTF-8 HOME rows execute
        if: matrix.shard == 0
        run: bash script/test/non-utf8-home-rows.sh

  # Everything that needs only a debug build of the workspace, plus the one
  # place a real release binary is linked.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (2026-08-05)
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcap-ng-dev libdbus-1-dev

      - name: Format check
        continue-on-error: true
        run: cargo fmt --all -- --check

      # Gating lint. `--all-targets` covers the integration tests and every
      # workspace member, so a lint regression in test-only code fails the
      # build too. Unlike the format check above, this step is deliberately not
      # `continue-on-error`: it is clean as of this commit and must stay clean.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Single-binary contract
        run: bash script/test/single-binary-contract.sh

      # No guest agentd is staged first: the vendored filesystem crate embeds
      # `build/agentd` only under `embed-binaries`, which only the `msb` CLI
      # enables. agent-vm drives that external `msb`, which carries the agent.
      #
      # A real release link, and the only step that pays for one: release
      # codegen+link measured 5m10s, and nothing in this workflow consumes
      # `target/release/agent-vm` — the single-binary contract builds its own
      # debug binary. So a PR no longer pays it, while `main` (which ships)
      # still proves the binary links. `Check release tests` below keeps the
      # release test profile compiling on every run.
      - name: Build (release)
        if: github.ref == 'refs/heads/main'
        run: cargo build --release -p agent-vm

      # Type-check-only. CI runs the *debug* test profile, so the release test
      # profile rots silently: a `#[cfg(test)]` use of a `#[cfg(debug_assertions)]`
      # item (the recording keychain) compiled in debug and broke `--release`.
      # `cargo check` is deliberate rather than `cargo test --no-run`: the class
      # of rot here is a name-resolution error, which `check` catches, while
      # `--no-run` pays for release codegen and linking for no extra coverage.
      # Neither runs the tests: the debug-only seams are compiled out under
      # `--release` and the tests that need them fail loudly rather than skip
      # (see `tests/secret_pty.rs`), so the release *run* is not a gate.
      #
      # Only a `main` run produces release artefacts, so a PR's check can be
      # cold (a release type-check of the dependency tree, a couple of minutes)
      # whenever a PR was the first run for a new Cargo.lock. It is type-check
      # work off the critical path, not a build.
      - name: Check release tests
        run: cargo check --release -p agent-vm --tests

  # The macOS build script's own logic: the toolchain-version parsing, the floor
  # guard and the rustup invocation shape. `build-workflow.sh` exercises
  # `script/build/macos.sh` entirely against fake `rustc`/`cargo`/`rustup` on
  # `PATH`, inside a fixture repository it builds itself (see that script's
  # `make_fixture`), so this leg needs no Rust toolchain step and no macOS.
  #
  # It ran on `macos-latest` until #665: 44 seconds of work, behind whatever wait
  # a hosted macOS runner took, and five times in one week that wait ended in the
  # platform cancelling the job before its first step. The leg reddened
  # `build-and-test` for a runner it never needed, so it runs on Linux now --
  # measured on ubuntu 24.04, where the BSD-form `stat` probes fall through to
  # the GNU form exactly as the script's own portability comment intends.
  #
  # What a Linux run cannot answer: on macOS this leg ran under `/bin/bash` 3.2,
  # so a bash-4 construct in the exercised script failed here before it reached a
  # macOS user. `ci-legs.sh` still runs the leg under a pinned interpreter and
  # records it in the receipt, a developer on macOS still gets 3.2, and #667 owns
  # the rest.
  build-script:
    runs-on: ubuntu-latest
    # Bounds a leg that hangs (this one needs 44s).
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Through ci-legs.sh, which is also what a developer runs: one definition
      # of the leg, its pinned environment and its receipt, so local and CI
      # cannot drift (#662's follow-up).
      - name: Run macOS build script workflow tests
        run: bash script/test/ci-legs.sh build-script

  # Every leg that genuinely consults macOS. They share one job because hosted
  # macOS capacity is the scarce thing (#593, #665): a job waiting for a runner is
  # cancelled by the platform at its own unreported limit -- 15m01s, no step run,
  # five times in one week -- so two macOS jobs per commit is two independent
  # chances to lose the run, and the second one buys nothing but a leg that
  # proves itself while the other never starts.
  #
  # The 20 minutes below bound a wedged build: a cold cache builds the workspace
  # for ~8 minutes before either Rust test runs (7m17s and 8m37s observed), which
  # is what #710/#711 raised this to. Nothing here bounds or reports a starved
  # queue; `build-and-test` does, by naming this job.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # The notification helper is Swift only, so it needs neither the toolchain
      # nor the cargo cache below: it compiles the real source, stamps and lints
      # its `Info.plist`, signs it ad-hoc and executes `--version`/
      # `--check-bundle` inside a temp bundle (#501 slice 4). It never touches an
      # installed bundle or LaunchServices. First, because 13 seconds of real
      # `swiftc`/`codesign`/`plutil` should fail a run before eight minutes of
      # build gets the chance to.
      - name: Run the notification helper contract
        run: bash script/test/ci-legs.sh notifier-contract

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (2026-08-05)
        with:
          toolchain: "1.98.1"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      # The real `/usr/bin/security` contract for the keychain host credential
      # location (#497, ADR-0056). The test is isolated to a disposable keychain
      # in a temp dir, so a shared runner is fine.
      - name: Real `security` contract (disposable keychain)
        run: bash script/test/ci-legs.sh keychain-contract

      # ADR-0072 makes the test tooling Rust, so the harness has to build and pass
      # on macOS too, and not only on the Linux `contracts` job. It rides in this
      # job because the job already pays for the toolchain and the submodules.
      - name: Harness checks
        run: bash script/test/ci-legs.sh harness

  # The single check to require on a branch. Every leg above is independent, so
  # this job only aggregates them -- and it keeps the name the pre-split workflow
  # used, so a branch protection rule that names it needs no change. `always()`
  # is what lets it run when a leg failed (a job with `needs` is otherwise
  # skipped, and a skipped required check never turns red).
  build-and-test:
    if: always()
    needs: [contracts, test, lint, build-script, macos]
    runs-on: ubuntu-latest
    steps:
      # No step condition on purpose. `contains(needs.*.result, 'cancelled')`
      # did not fire for a leg that was cancelled before a runner ever picked it
      # up: on #664 and on that change's own run, `macos-keychain-contract` was
      # `cancelled` while this job reported success, so the only required check
      # went green under a red run. The needs context calls that state
      # `abandoned` -- a fourth value the expression never listed -- and this job
      # printed it, named the leg and failed, on the same starvation (#665).
      - name: Fail when a leg did not pass
        env:
          # Through the environment, not interpolated into `run`: the needs
          # payload is JSON and zizmor flags a template in a script body.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Name every leg and its result, then fail: "a CI leg failed" does not
          # say whether the leg ran and failed or never got a runner.
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          bad="$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<<"$NEEDS")"
          if [[ -z "$bad" ]]; then
            exit 0
          fi
          while read -r leg; do
            echo "::error::leg $leg did not pass"
          done <<<"$bad"
          exit 1
