name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcap-ng-dev libdbus-1-dev musl-tools shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      # The microsandbox SDK embeds the guest agentd binary. agent-vm builds it
      # from the pinned source (we dropped the upstream prebuilt download), so
      # the static musl agentd must exist at vendor/microsandbox/build/agentd
      # before any `cargo build -p agent-vm`. Mirrors the release-npm workflow.
      - name: Check runtime source provenance and harness contracts
        run: |
          bash vendor/microsandbox/vendor/libkrunfw/scripts/test-build-in-docker.sh
          ./script/test/runtime-provenance.sh
          ./script/check-runtime-provenance.sh
          cargo test --locked -p msb-krun-compat-evidence
          cargo clippy --locked -p msb-krun-compat-evidence --all-targets -- -D warnings
          ./script/test/msb-krun-compat-contract.sh
          bash script/test/build-workflow.sh
          ./script/check-rust-toolchain.sh
          bash script/test/rust-toolchain-consistency.sh
          bash -n vendor/microsandbox/vendor/libkrunfw/build_in_docker.sh \
            vendor/microsandbox/vendor/libkrunfw/scripts/test-build-in-docker.sh \
            script/check-runtime-provenance.sh script/test/runtime-provenance.sh \
            script/test/msb-krun-compat.sh script/test/msb-krun-compat-contract.sh \
            script/build/macos.sh script/test/build-workflow.sh \
            script/check-rust-toolchain.sh script/test/rust-toolchain-consistency.sh
          shellcheck vendor/microsandbox/vendor/libkrunfw/build_in_docker.sh \
            vendor/microsandbox/vendor/libkrunfw/scripts/test-build-in-docker.sh \
            script/check-runtime-provenance.sh script/test/runtime-provenance.sh \
            script/test/msb-krun-compat.sh script/test/msb-krun-compat-contract.sh \
            script/build/macos.sh script/test/build-workflow.sh \
            script/check-rust-toolchain.sh script/test/rust-toolchain-consistency.sh
          "$HOME/go/bin/actionlint"

      - name: Build guest agentd
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release \
            --manifest-path vendor/microsandbox/crates/agentd/Cargo.toml \
            --target-dir vendor/microsandbox/target \
            --target x86_64-unknown-linux-musl
          mkdir -p vendor/microsandbox/build
          cp vendor/microsandbox/target/x86_64-unknown-linux-musl/release/agentd \
            vendor/microsandbox/build/agentd
          touch vendor/microsandbox/build/agentd

      - name: Build
        run: cargo build --release -p agent-vm

      - name: Test
        run: cargo test -p agent-vm

      - name: Format check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy
        continue-on-error: true
        run: cargo clippy -p agent-vm --release -- -D warnings

  # macOS is a first-class supported host (script/build/macos.sh,
  # macos-build.md) but a full libkrunfw/msb build is too slow for per-PR
  # CI (it's covered separately in release-npm.yml). This leg proves the
  # 1.94 pin's own logic — the toolchain-version parsing, floor guard, and
  # rustup invocation shape — runs correctly on the platform that carries
  # it, without paying for a real toolchain/VM build: build-workflow.sh
  # exercises script/build/macos.sh entirely against fake `rustc`/`cargo`/
  # `rustup` on PATH (see the script's make_fixture), so it needs no Rust
  # toolchain install step at all.
  macos-build-script:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run macOS build script workflow tests
        run: bash script/test/build-workflow.sh
