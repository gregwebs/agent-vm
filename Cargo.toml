[workspace]
resolver = "3"
members = ["crates/agent-vm", "crates/msb-krun-compat-evidence"]
# microsandbox declares its own workspace under vendor/; keep it separate
# so Cargo doesn't try to absorb it into ours.
exclude = ["vendor/microsandbox"]

[workspace.package]
version = "0.1.28"
edition = "2024"
license = "MIT"
repository = "https://github.com/wirenboard/agent-vm"
# Kept in exact lockstep with rust-toolchain.toml's channel, which is the
# canonical pin and owner (see that file's header). script/check-rust-toolchain.sh
# enforces the two stay equal, in CI and locally.
rust-version = "1.94"

[profile.release]
codegen-units = 16
lto = "thin"
strip = true

# For distribution builds where binary size / runtime perf matter most.
# Slower to build (single-threaded LTO + 1 codegen unit). Use: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
