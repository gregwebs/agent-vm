[workspace]
resolver = "3"
members = ["crates/agent-vm"]
# microsandbox declares its own workspace under vendor/; keep it separate
# so Cargo doesn't try to absorb it into ours.
exclude = ["vendor/microsandbox"]

[workspace.package]
version = "0.1.27"
edition = "2024"
license = "MIT"
repository = "https://github.com/wirenboard/agent-vm"

# Temporary test pin: keep the SDK graph on the same console-fix cohort as
# the nested microsandbox workspace that builds the executed `msb` binary.
[patch.crates-io]
msb_krun = { git = "https://github.com/gregwebs/libkrun", rev = "846d527335a4921ddc372d6889f3a887ce05966f" }

[profile.release]
codegen-units = 16
lto = "thin"
strip = true

# For distribution builds where binary size / runtime perf matter most.
# Slower to build (single-threaded LTO + 1 codegen unit). Use: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
